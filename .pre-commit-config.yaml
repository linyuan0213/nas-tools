repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: true

      - id: pytest
        name: pytest
        entry: uv run pytest tests/ -v --no-header -q
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

      - id: scan-secrets
        name: scan-secrets
        entry: uv run python scripts/scan_secrets.py
        language: system
        types: [text]
        pass_filenames: true
        always_run: true
