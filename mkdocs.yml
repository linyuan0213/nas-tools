site_name: Nexus Media 文档
site_description: Nexus Media 多功能媒体库管理工具使用文档
site_url: https://linyuan0213.github.io/nexus-media/
repo_url: https://github.com/linyuan0213/nexus-media
edit_uri: edit/master/docs/
docs_dir: docs

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.tabs.link
    - toc.follow

plugins:
  - search:
      lang: zh
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

extra_css:
  - assets/extra.css

not_in_nav: |
  decisions/

nav:
  - 首页: index.md
  - 安装部署: installation.md
  - 使用指南:
      - 基础配置: configuration.md
      - AI 助手: agent.md
      - 资源搜索与探索: search.md
      - 站点配置: sites.md
      - 过滤规则: filter_rules.md
      - 下载管理: download_management.md
      - 下载器配置: downloaders.md
      - 媒体服务器: media_servers.md
      - 目录同步: directory_sync.md
      - 媒体库: media_library.md
      - 媒体整理: media_organization.md
      - RSS 订阅: rss.md
      - 索引器配置: indexers.md
      - 通知渠道配置: notifications.md
      - 消息通知模板: message_templates.md
      - 服务与调度: service.md
      - 存储后端: storage.md
      - 用户与权限: users.md
  - 插件:
      - 插件使用: plugins.md
      - 插件开发: plugin_development_guide.md
  - 开发者:
      - 本地开发: development.md
      - 架构文档: architecture.md
      - AI 助手设计: agent-mvp-detailed-design.md
  - 常见问题: faq.md
  - 更新日志: changelog.md
