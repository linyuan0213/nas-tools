# Nexus Media 基础版：前后端 + Redis，使用 SQLite（无需外部数据库）
# 启动：docker compose up -d
services:
  frontend:
    image: linyuan0213/nexus-media-web:latest
    ports:
      - 8080:8080
    restart: always
    container_name: nexus-media-web
    networks:
      - nexus-media-network
    depends_on:
      backend:
        condition: service_healthy
        required: false

  # 后端：启动时自动执行 alembic 迁移（镜像内置，无需独立 migration 容器）
  backend:
    image: linyuan0213/nexus-media:latest
    ports:
      - 3000:8080
    volumes:
      - ./data:/data
      # 替换为你的实际媒体目录，例如：
      # - /mnt/media:/media
    restart: always
    hostname: nexus-media
    container_name: nexus-media
    networks:
      nexus-media-network:
        aliases:
          - backend
    environment:
      PUID: "0"
      PGID: "0"
      UMASK: "000"
      NEXUS_MEDIA_DATA: /data
      REDIS__HOST: redis
      REDIS__PORT: "6379"
      REDIS__DB: "0"
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: "wget -qO- http://localhost:8080/health || exit 1"
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: nexus-media-redis
    restart: always
    networks:
      - nexus-media-network
    volumes:
      - ./data/redis_data:/data
    command: redis-server --save "" --appendonly no --dir /data

networks:
  nexus-media-network:
    driver: bridge
    name: nexus-media-network
